version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: complaint_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: complaint_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d complaint_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: complaint_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PROJECT_NAME: "Universal Complaint Management System"
      API_V1_STR: "/api/v1"
      DATABASE_URL: "postgresql+psycopg2://postgres:postgrespassword@postgres:5432/complaint_db"
      SECRET_KEY: "production-ready-super-secret-key-replace-in-env"
      AI_PROVIDER: "local_fallback"
      EMAILS_ENABLED: "false"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
    command: >
      sh -c "alembic upgrade head &&
             python seed.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
